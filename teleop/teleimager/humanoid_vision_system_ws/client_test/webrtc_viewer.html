<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebRTC 多相机视觉系统</title>
    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --error-color: #e74c3c;
            --offline-color: #95a5a6;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --bg-color: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
            max-width: 1920px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .header-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .header-stats {
                grid-template-columns: 1fr;
            }
        }

        .stats-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .stats-label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .stats-value {
            font-weight: bold;
            font-size: 1.3rem;
        }

        .latency-low { color: var(--success-color); }
        .latency-medium { color: var(--warning-color); }
        .latency-high { color: var(--error-color); }

        .controls-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px var(--shadow-color);
            border: 1px solid var(--border-color);
        }

        .panel-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-field label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .input-field input {
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-field input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 44px;
            white-space: nowrap;
        }

        .button-primary {
            background: var(--primary-color);
            color: white;
        }
        .button-primary:hover:not(:disabled) {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
        }

        .button-success {
            background: var(--success-color);
            color: white;
        }
        .button-success:hover:not(:disabled) {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
        }

        .button-danger {
            background: var(--error-color);
            color: white;
        }
        .button-danger:hover:not(:disabled) {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.2);
        }

        .button-secondary {
            background: #95a5a6;
            color: white;
        }
        .button-secondary:hover:not(:disabled) {
            background: #7f8c8d;
            transform: translateY(-2px);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .cameras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .cameras-grid {
                grid-template-columns: 1fr;
            }
        }

        .camera-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 8px var(--shadow-color);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .camera-card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .camera-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .camera-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-connected { background-color: var(--success-color); }
        .status-connecting { background-color: var(--warning-color); }
        .status-disconnected { background-color: var(--error-color); }
        .status-error { background-color: var(--error-color); }

        .camera-controls {
            display: flex;
            gap: 10px;
        }

        .camera-card-body {
            padding: 25px;
            flex: 1;
        }

        .connection-info {
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.05);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            word-break: break-all;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .video-container {
            background: #2c3e50;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            max-height: 500px;
            background: #1a252f;
        }

        .camera-stats {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .camera-stats {
                grid-template-columns: 1fr;
            }
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            background: white;
            border-radius: 6px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .stat-value {
            font-weight: 600;
            font-size: 1rem;
        }

        .no-cameras {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 1.1rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 2px dashed var(--border-color);
        }

        .debug-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .debug-content {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎥 WebRTC 多相机视觉系统</h1>
        <p class="header-subtitle">实时监控多个 WebRTC 视频流 | 低延迟 | 连接质量监控</p>
        <div class="header-stats">
            <div class="stats-item">
                <div class="stats-label">在线相机</div>
                <div class="stats-value" id="connected-count">0/0</div>
            </div>
            <div class="stats-item">
                <div class="stats-label">连接质量</div>
                <div class="stats-value latency-low" id="connection-quality">100%</div>
            </div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="panel-title">📷 添加WebRTC相机</div>
        <div class="input-group">
            <div class="input-field">
                <label>相机ID</label>
                <input type="text" id="camera-id" placeholder="例如: head_camera" value="head_camera">
            </div>
            <div class="input-field">
                <label>服务器地址</label>
                <input type="text" id="server-host" placeholder="例如: localhost" value="localhost">
            </div>
            <div class="input-field">
                <label>端口</label>
                <input type="number" id="server-port" placeholder="例如: 8998" value="8998">
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button id="add-webrtc-btn" class="button button-primary">➕ 添加相机</button>
            <button id="connect-all-webrtc" class="button button-success">🔗 连接所有</button>
            <button id="disconnect-all-webrtc" class="button button-danger">🔌 断开所有</button>
        </div>
    </div>

    <div class="cameras-grid" id="webrtc-cameras-container">
        <div class="no-cameras" id="noCamerasMessage">
            <div style="font-size: 2rem; margin-bottom: 20px;">📷</div>
            <h3>暂无WebRTC相机</h3>
            <p>点击上方的"添加相机"按钮，添加你的第一个WebRTC视频流</p>
        </div>
    </div>

    <div class="debug-panel">
        <div class="debug-header">
            <div class="panel-title">
                <span>🔧 调试信息</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="toggleDebugBtn" class="button button-secondary">切换显示</button>
                <button id="clearDebugBtn" class="button button-secondary">清空日志</button>
            </div>
        </div>
        <div class="debug-content" id="debugContent" style="display: none;"></div>
    </div>

    <script>
        class WebRTCClient {
            constructor(cameraId, config = {}) {
                this.cameraId = cameraId;
                this.config = {
                    host: config.host || 'localhost',
                    port: config.port || 8000,
                    videoCodec: config.videoCodec || 'H264',
                    maxBitrate: config.maxBitrate || 2000,
                    iceTimeout: config.iceTimeout || 30,
                    connectionTimeout: config.connectionTimeout || 60,
                    stunServers: config.stunServers || ['stun:stun.l.google.com:19302'],
                    turnServers: config.turnServers || [],
                    ...config
                };

                this.isConnected = false;
                this.isConnecting = false;
                this.peerConnection = null;
                this.dataChannel = null;
                this.videoTrack = null;
                this.remoteStream = null;

                this.stats = {
                    frameCount: 0,
                    fps: 0,
                    lastFrameTime: 0,
                    latency: 0,
                    packetLoss: 0,
                    connectionQuality: 100
                };

                this.latencyHistory = { server: [], network: [], total: [] };
                this.onStatusChange = config.onStatusChange || null;
                this.onError = config.onError || null;
                this.onStatsUpdate = config.onStatsUpdate || null;

                this.statsTimer = null;
                this.connectionTimer = null;
                this.iceTimer = null;

                this.init();
            }

            init() {
                this.log(`初始化WebRTC客户端: ${this.cameraId}`);
                this.setupEventListeners();
            }

            setupEventListeners() {
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden && this.isConnected) {
                        this.log('页面隐藏，暂停连接');
                    } else if (!document.hidden && !this.isConnected) {
                        this.reconnect();
                    }
                });

                window.addEventListener('online', () => {
                    this.log('网络恢复，尝试重新连接');
                    this.reconnect();
                });

                window.addEventListener('offline', () => {
                    this.log('网络断开');
                    this.updateStatus('disconnected', '网络连接断开');
                });
            }

            async connect() {
                if (this.isConnecting || this.isConnected) {
                    return;
                }

                this.isConnecting = true;
                this.updateStatus('connecting', '正在建立WebRTC连接...');

                try {
                    this.peerConnection = new RTCPeerConnection({
                        iceServers: this.getIceServers()
                    });

                    this.setupPeerConnectionEvents();

                    this.dataChannel = this.peerConnection.createDataChannel('metadata', {
                        ordered: true,
                        maxRetransmits: 3
                    });
                    this.setupDataChannelEvents();

                    this.connectionTimer = setTimeout(() => {
                        if (!this.isConnected) {
                            this.handleError('连接超时');
                        }
                    }, this.config.connectionTimeout * 1000);

                    const offer = await this.peerConnection.createOffer({
                        offerToReceiveVideo: true,
                        offerToReceiveAudio: false
                    });
                    await this.peerConnection.setLocalDescription(offer);
                    await this.sendOfferToSignalingServer(offer);

                    this.log('Offer已发送，等待Answer...');

                } catch (error) {
                    this.handleError(`连接失败: ${error.message}`);
                }
            }

            setupPeerConnectionEvents() {
                this.peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        this.sendIceCandidateToServer(event.candidate);
                    }
                };

                this.peerConnection.oniceconnectionstatechange = () => {
                    const state = this.peerConnection.iceConnectionState;
                    this.log(`ICE状态: ${state}`);
                    
                    switch (state) {
                        case 'connected':
                            this.onIceConnected();
                            break;
                        case 'disconnected':
                            this.updateStatus('disconnected', 'ICE连接断开');
                            break;
                        case 'failed':
                            this.handleError('ICE连接失败');
                            break;
                        case 'closed':
                            this.cleanup();
                            break;
                    }
                };

                this.peerConnection.onconnectionstatechange = () => {
                    this.log(`连接状态: ${this.peerConnection.connectionState}`);
                };

                this.peerConnection.ontrack = (event) => {
                    this.log('收到远程视频轨道');
                    const videoElement = document.getElementById(`webrtc-video-${this.cameraId}`);
                    if (!videoElement) {
                        this.log('错误：未找到视频元素');
                        return;
                    }

                    if (event.streams && event.streams[0]) {
                        videoElement.srcObject = event.streams[0];
                    } else {
                        videoElement.srcObject = new MediaStream();
                    }

                    videoElement.muted = true;
                    videoElement.autoplay = true;
                    videoElement.playsInline = true;

                    videoElement.play().then(() => {
                        this.log(`视频播放成功，分辨率: ${videoElement.videoWidth}x${videoElement.videoHeight}`);
                        this.updateResolutionDisplay(videoElement.videoWidth, videoElement.videoHeight);
                        this.startFrameRateMonitoring();
                    }).catch(err => {
                        this.log(`视频播放失败: ${err}`);
                    });
                };
            }

            setupDataChannelEvents() {
                this.dataChannel.onopen = () => {
                    this.log('数据通道已打开');
                    this.startLatencyMonitoring();
                };

                this.dataChannel.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        this.handleDataChannelMessage(data);
                    } catch (error) {
                        this.log('数据通道消息解析失败');
                    }
                };

                this.dataChannel.onclose = () => {
                    this.log('数据通道已关闭');
                };
            }

            handleDataChannelMessage(data) {
                switch (data.type) {
                    case 'latency_ping':
                        this.handleLatencyPing(data);
                        break;
                    case 'camera_status':
                        this.handleCameraStatus(data);
                        break;
                    case 'video_frame':
                        this.handleVideoFrame(data);
                        break;
                }
            }

            async sendOfferToSignalingServer(offer) {
                try {
                    const response = await fetch(`https://${this.config.host}:${this.config.port}/webrtc/${this.cameraId}/offer`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            type: 'offer',
                            sdp: offer.sdp,
                            connection_id: this.cameraId
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const answer = await response.json();
                    if (answer.error) {
                        throw new Error(answer.error);
                    }

                    await this.peerConnection.setRemoteDescription(
                        new RTCSessionDescription(answer)
                    );
                    this.log('Answer已设置');
                } catch (error) {
                    this.handleError(`发送Offer失败: ${error.message}`);
                }
            }

            async sendIceCandidateToServer(candidate) {
                try {
                    await fetch(`https://${this.config.host}:${this.config.port}/webrtc/${this.cameraId}/ice-candidate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            type: 'ice-candidate',
                            candidate: candidate.candidate,
                            sdpMid: candidate.sdpMid,
                            sdpMLineIndex: candidate.sdpMLineIndex,
                            connection_id: this.cameraId
                        })
                    });
                } catch (error) {
                    this.log(`发送ICE候选失败: ${error.message}`);
                }
            }

            getIceServers() {
                const servers = [];
                this.config.stunServers.forEach(url => {
                    servers.push({ urls: url });
                });
                this.config.turnServers.forEach(config => {
                    servers.push({
                        urls: config.urls,
                        username: config.username,
                        credential: config.credential
                    });
                });
                return servers;
            }

            onIceConnected() {
                clearTimeout(this.connectionTimer);
                clearTimeout(this.iceTimer);
                this.isConnecting = false;
                this.isConnected = true;
                this.updateStatus('connected', 'WebRTC连接已建立');
                this.log('WebRTC连接成功建立');
                this.startLatencyMonitoring();
            }

            disconnect() {
                this.log('断开WebRTC连接');
                this.isConnecting = false;
                this.isConnected = false;
                this.cleanup();
                this.updateStatus('disconnected', '连接已断开');
            }

            cleanup() {
                clearTimeout(this.connectionTimer);
                clearTimeout(this.iceTimer);
                clearInterval(this.statsTimer);
                if (this.peerConnection) {
                    this.peerConnection.close();
                    this.peerConnection = null;
                }
                this.dataChannel = null;
                const video = document.getElementById(`webrtc-video-${this.cameraId}`);
                if (video) {
                    video.srcObject = null;
                }
                this.remoteStream = null;
                this.videoTrack = null;
            }

            reconnect() {
                if (this.isConnecting) return;
                this.log('尝试重新连接...');
                this.disconnect();
                setTimeout(() => this.connect(), 2000);
            }

            startStatsMonitoring() {
                this.statsTimer = setInterval(async () => {
                    if (this.peerConnection && this.isConnected) {
                        await this.updateConnectionStats();
                    }
                }, 1000);
            }

            async updateConnectionStats() {
                try {
                    const stats = await this.peerConnection.getStats();
                    let totalPacketLoss = 0, candidatePair = null;
                    let framesReceived = 0, framesDecoded = 0;
                    
                    stats.forEach(report => {
                        if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                            candidatePair = report;
                        }
                        if (report.type === 'remote-inbound-rtp' && report.kind === 'video') {
                            totalPacketLoss = (report.packetsLost / report.packetsReceived) * 100;
                        }
                        if (report.type === 'inbound-rtp' && report.kind === 'video') {
                            framesReceived = report.framesReceived || 0;
                            framesDecoded = report.framesDecoded || 0;
                        }
                    });
                    
                    this.stats.packetLoss = totalPacketLoss;
                    
                    if (candidatePair) {
                        this.stats.connectionQuality = this.calculateConnectionQuality(
                            candidatePair.currentRoundTripTime,
                            totalPacketLoss
                        );
                    }
                    
                    if (this.onStatsUpdate) {
                        this.onStatsUpdate({ cameraId: this.cameraId, stats: this.stats });
                    }
                } catch (error) {
                    this.log(`统计更新失败: ${error.message}`);
                }
            }

            startFrameRateMonitoring() {
                const video = document.getElementById(`webrtc-video-${this.cameraId}`);
                if (!video) return;

                let lastPresentedFrames = 0;
                let lastUpdateTime = performance.now();

                const onFrame = (now, metadata) => {
                    const deltaFrames = metadata.presentedFrames - lastPresentedFrames;
                    const deltaTime = now - lastUpdateTime;

                    if (deltaTime >= 1000 && deltaFrames > 0) {
                        this.stats.fps = Math.round((deltaFrames * 1000) / deltaTime);
                        this.stats.frameCount = metadata.presentedFrames;
                        this.updateFPSDisplay();
                        lastPresentedFrames = metadata.presentedFrames;
                        lastUpdateTime = now;
                    }

                    if (this.isConnected && video) {
                        video.requestVideoFrameCallback(onFrame);
                    }
                };

                video.requestVideoFrameCallback(onFrame);
            }

            startLatencyMonitoring() {
                setInterval(() => {
                    if (!this.isConnected || !this.dataChannel || this.dataChannel.readyState !== 'open') return;
                    
                    this.dataChannel.send(JSON.stringify({
                        type: 'latency_ping',
                        clientTimestamp: performance.now(),
                        serverTimestamp: Date.now()
                    }));
                }, 5000);
            }

            handleLatencyPing(pingData) {
                const responseTime = performance.now() - pingData.clientTimestamp;
                this.updateLatencyStat('network', responseTime / 2);
                if (this.dataChannel && this.dataChannel.readyState === 'open') {
                    this.dataChannel.send(JSON.stringify({
                        type: 'latency_pong',
                        serverTimestamp: pingData.serverTimestamp,
                        clientTimestamp: performance.now()
                    }));
                }
            }

            updateLatencyStat(type, value) {
                this.latencyHistory[type].push(value);
                if (this.latencyHistory[type].length > 10) {
                    this.latencyHistory[type].shift();
                }
                
                const avgNetwork = this.latencyHistory.network.reduce((a, b) => a + b, 0) / this.latencyHistory.network.length;
                this.stats.latency = Math.round(avgNetwork);
                this.updateLatencyDisplay();
            }

            calculateConnectionQuality(rtt, packetLoss) {
                let quality = 100;
                if (rtt > 0) {
                    quality -= Math.min(rtt * 2, 50);
                }
                if (packetLoss > 0) {
                    quality -= Math.min(packetLoss * 5, 50);
                }
                return Math.max(0, Math.min(100, quality));
            }

            updateStatus(status, message) {
                this.log(`状态更新: ${status} - ${message}`);
                if (this.onStatusChange) {
                    this.onStatusChange({ cameraId: this.cameraId, status, message });
                }
            }

            handleError(error) {
                this.log(`错误: ${error}`);
                this.isConnecting = false;
                this.updateStatus('error', error);
                if (this.onError) {
                    this.onError({ cameraId: this.cameraId, error });
                }
            }

            log(message) {
                console.log(`[${this.cameraId}] ${message}`);
            }

            updateResolutionDisplay(width, height) {
                const element = document.getElementById(`resolution-${this.cameraId}`);
                if (element) {
                    element.textContent = `${width}x${height}`;
                }
            }

            updateFPSDisplay() {
                const element = document.getElementById(`fps-${this.cameraId}`);
                if (element) {
                    element.textContent = this.stats.fps;
                }
            }

            updateLatencyDisplay() {
                const element = document.getElementById(`latency-${this.cameraId}`);
                if (element) {
                    element.textContent = `${this.stats.latency} ms`;
                }
            }

            handleVideoFrame(frameData) {
                if (this.onVideoFrame) {
                    this.onVideoFrame({
                        cameraId: this.cameraId,
                        timestamp: frameData.metadata?.timestamp,
                        resolution: frameData.resolution,
                        metadata: frameData
                    });
                }
            }

            handleCameraStatus(status) {
                this.updateCameraStatusDisplay(status);
            }

            updateCameraStatusDisplay(status) {
                const statusElement = document.getElementById(`status-${this.cameraId}`);
                if (statusElement) {
                    const statusMap = {
                        'connected': '已连接',
                        'connecting': '连接中',
                        'disconnected': '已断开',
                        'error': '错误'
                    };
                    statusElement.textContent = statusMap[status.status] || status.status;
                }
            }
        }

        class WebRTCManager {
            constructor(config = {}) {
                this.config = {
                    maxCameras: config.maxCameras || 5,
                    autoReconnect: config.autoReconnect !== false,
                    reconnectDelay: config.reconnectDelay || 5000,
                    statsUpdateInterval: config.statsUpdateInterval || 1000,
                    ...config
                };
                this.cameras = new Map();
                this.cameraConfigs = new Map();
                this.globalStats = {
                    totalCameras: 0,
                    connectedCameras: 0,
                    totalFPS: 0,
                    avgLatency: 0,
                    totalPacketLoss: 0,
                    connectionQuality: 100
                };
                this.history = { latency: [], fps: [], connectionCount: [] };
                this.eventListeners = new Map();
                this.statsTimer = null;
                this.historyTimer = null;
                this.init();
            }

            init() {
                this.setupGlobalEventListeners();
                this.startStatsMonitoring();
                this.startHistoryRecording();
            }

            setupGlobalEventListeners() {
                window.addEventListener('beforeunload', () => this.cleanup());
                window.addEventListener('online', () => {
                    this.log('网络恢复，尝试重新连接所有相机');
                    this.reconnectAll();
                });
            }

            addCamera(cameraId, config) {
                if (this.cameras.size >= this.config.maxCameras) {
                    this.log('相机数量已达上限');
                    return false;
                }

                if (this.cameras.has(cameraId)) {
                    this.log(`相机 ${cameraId} 已存在`);
                    return false;
                }

                const client = new WebRTCClient(cameraId, {
                    ...config,
                    onStatusChange: (data) => this.handleStatusChange(data),
                    onError: (data) => this.handleClientError(data),
                    onStatsUpdate: (data) => this.handleStatsUpdate(data)
                });

                this.cameras.set(cameraId, client);
                this.cameraConfigs.set(cameraId, config);
                this.emit('camera_added', { cameraId, config });
                this.log(`相机 ${cameraId} 已添加`);
                return true;
            }

            removeCamera(cameraId) {
                const client = this.cameras.get(cameraId);
                if (client) {
                    client.disconnect();
                    this.cameras.delete(cameraId);
                    this.cameraConfigs.delete(cameraId);
                    this.emit('camera_removed', { cameraId });
                    this.log(`相机 ${cameraId} 已移除`);
                }
            }

            async connectCamera(cameraId) {
                const client = this.cameras.get(cameraId);
                if (client) {
                    await client.connect();
                }
            }

            disconnectCamera(cameraId) {
                const client = this.cameras.get(cameraId);
                if (client) {
                    client.disconnect();
                }
            }

            async connectAll() {
                this.log('连接所有相机');
                const connectPromises = [];
                this.cameras.forEach((client, cameraId) => {
                    connectPromises.push(client.connect());
                });
                await Promise.all(connectPromises);
            }

            disconnectAll() {
                this.log('断开所有相机');
                this.cameras.forEach((client, cameraId) => {
                    client.disconnect();
                });
            }

            reconnectAll() {
                this.log('重新连接所有相机');
                this.disconnectAll();
                setTimeout(() => this.connectAll(), this.config.reconnectDelay);
            }

            handleVideoFrame(frameData) {
                this.emit('video_frame', frameData);
                if (frameData.metadata && frameData.metadata.timestamp) {
                    const latency = performance.now() - frameData.metadata.timestamp;
                    this.updateLatencyHistory(latency);
                }
            }

            handleStatusChange(statusData) {
                this.emit('status_change', statusData);
                this.updateGlobalStats();
                this.updateUIStatus(statusData);
            }

            handleClientError(errorData) {
                this.emit('client_error', errorData);
                if (this.config.autoReconnect && errorData.cameraId) {
                    setTimeout(() => this.connectCamera(errorData.cameraId), this.config.reconnectDelay);
                }
            }

            handleStatsUpdate(statsData) {
                this.emit('stats_update', statsData);
            }

            startStatsMonitoring() {
                this.statsTimer = setInterval(() => this.updateGlobalStats(), this.config.statsUpdateInterval);
            }

            updateGlobalStats() {
                let connectedCount = 0, totalFPS = 0, totalLatency = 0, totalPacketLoss = 0, totalQuality = 0;
                this.cameras.forEach((client, cameraId) => {
                    if (client.isConnected) {
                        connectedCount++;
                        totalFPS += client.stats.fps || 0;
                        totalLatency += client.stats.latency || 0;
                        totalPacketLoss += client.stats.packetLoss || 0;
                        totalQuality += client.stats.connectionQuality || 0;
                    }
                });
                this.globalStats.totalCameras = this.cameras.size;
                this.globalStats.connectedCameras = connectedCount;
                this.globalStats.totalFPS = connectedCount > 0 ? totalFPS / connectedCount : 0;
                this.globalStats.avgLatency = connectedCount > 0 ? totalLatency / connectedCount : 0;
                this.globalStats.totalPacketLoss = connectedCount > 0 ? totalPacketLoss / connectedCount : 0;
                this.globalStats.connectionQuality = connectedCount > 0 ? totalQuality / connectedCount : 100;
                this.emit('global_stats_update', this.globalStats);
                this.updateUIGlobalStats();
            }

            startHistoryRecording() {
                this.historyTimer = setInterval(() => {
                    const now = Date.now();
                    this.history.fps.push({ timestamp: now, value: this.globalStats.totalFPS });
                    this.history.connectionCount.push({ timestamp: now, value: this.globalStats.connectedCameras });
                    Object.keys(this.history).forEach(key => {
                        if (this.history[key].length > 100) this.history[key].shift();
                    });
                    this.emit('history_updated', this.history);
                }, 5000);
            }

            updateLatencyHistory(latency) {
                this.history.latency.push({ timestamp: Date.now(), value: latency });
                if (this.history.latency.length > 100) this.history.latency.shift();
            }

            updateUIStatus(statusData) {
                const { cameraId, status, message } = statusData;
                this.log(`相机 ${cameraId} 状态更新: ${status} - ${message}`);
            }

            updateUIGlobalStats() {
                const stats = this.globalStats;
                const connectedElement = document.getElementById('connected-count');
                if (connectedElement) connectedElement.textContent = `${stats.connectedCameras}/${stats.totalCameras}`;
                const qualityElement = document.getElementById('connection-quality');
                if (qualityElement) {
                    qualityElement.textContent = `${stats.connectionQuality.toFixed(0)}%`;
                    let cls = 'latency-low';
                    if (stats.connectionQuality < 60) cls = 'latency-high';
                    else if (stats.connectionQuality < 80) cls = 'latency-medium';
                    qualityElement.className = `stats-value ${cls}`;
                }
            }

            on(event, callback) {
                if (!this.eventListeners.has(event)) {
                    this.eventListeners.set(event, []);
                }
                this.eventListeners.get(event).push(callback);
            }

            emit(event, data) {
                const listeners = this.eventListeners.get(event);
                if (listeners) {
                    listeners.forEach(callback => callback(data));
                }
            }

            cleanup() {
                clearInterval(this.statsTimer);
                clearInterval(this.historyTimer);
                this.cameras.forEach((client, cameraId) => {
                    client.disconnect();
                });
                this.cameras.clear();
                this.cameraConfigs.clear();
            }

            log(message) {
                console.log(`[WebRTCManager] ${message}`);
            }
        }

        class WebRTCIntegration {
            constructor() {
                this.webrtcManager = null;
                this.uiElements = {};
                this.isInitialized = false;
                this.debugLogs = [];
                this.init();
            }

            init() {
                if (this.isInitialized) return;
                this.setupUIElements();
                this.setupEventListeners();
                this.initializeWebRTCManager();
                this.isInitialized = true;
                console.log('WebRTC界面集成已初始化');
            }

            setupUIElements() {
                this.uiElements = {
                    connectedCount: document.getElementById('connected-count'),
                    avgFps: document.getElementById('avg-fps'),
                    avgLatency: document.getElementById('avg-latency'),
                    connectionQuality: document.getElementById('connection-quality'),
                    camerasContainer: document.getElementById('webrtc-cameras-container'),
                    addCameraPanel: document.getElementById('add-webrtc-camera-panel') || document.querySelector('.add-camera-section')
                };
            }

            setupEventListeners() {
                const addBtn = document.getElementById('add-webrtc-btn');
                if (addBtn) addBtn.addEventListener('click', () => this.addNewCamera());
                const connectAllBtn = document.getElementById('connect-all-webrtc');
                if (connectAllBtn) connectAllBtn.addEventListener('click', () => this.webrtcManager?.connectAll());
                const disconnectAllBtn = document.getElementById('disconnect-all-webrtc');
                if (disconnectAllBtn) disconnectAllBtn.addEventListener('click', () => this.webrtcManager?.disconnectAll());
                const toggleDebugBtn = document.getElementById('toggleDebugBtn');
                const clearDebugBtn = document.getElementById('clearDebugBtn');
                const debugContent = document.getElementById('debugContent');
                if (toggleDebugBtn) {
                    toggleDebugBtn.addEventListener('click', () => {
                        if (debugContent) debugContent.style.display = debugContent.style.display === 'none' ? 'block' : 'none';
                    });
                }
                if (clearDebugBtn) {
                    clearDebugBtn.addEventListener('click', () => { this.debugLogs = []; if (debugContent) debugContent.textContent = ''; });
                }
            }

            initializeWebRTCManager() {
                this.webrtcManager = new WebRTCManager({
                    maxCameras: 5,
                    autoReconnect: true,
                    reconnectDelay: 5000,
                    statsUpdateInterval: 1000
                });
                this.webrtcManager.on('camera_added', (data) => this.onCameraAdded(data));
                this.webrtcManager.on('camera_removed', (data) => this.onCameraRemoved(data));
                this.webrtcManager.on('status_change', (data) => this.onStatusChange(data));
                this.webrtcManager.on('global_stats_update', (data) => this.onGlobalStatsUpdate(data));
            }

            addNewCamera() {
                const cameraId = document.getElementById('camera-id').value.trim();
                const host = document.getElementById('server-host').value.trim();
                const port = document.getElementById('server-port').value.trim();

                if (!cameraId || !host || !port) {
                    this.log('请填写完整的相机信息');
                    return;
                }

                const success = this.webrtcManager.addCamera(cameraId, { host, port });
                if (success) {
                    this.log(`相机 ${cameraId} 添加成功`);
                } else {
                    this.log(`相机 ${cameraId} 添加失败`);
                }
            }

            onCameraAdded(data) {
                const { cameraId, config } = data;
                const container = this.uiElements.camerasContainer;
                const noCamerasMsg = document.getElementById('noCamerasMessage');
                if (noCamerasMsg) noCamerasMsg.style.display = 'none';

                const cameraCard = document.createElement('div');
                cameraCard.className = 'camera-card';
                cameraCard.id = `camera-card-${cameraId}`;
                cameraCard.innerHTML = `
                    <div class="camera-card-header">
                        <div class="camera-title">📷 ${cameraId}</div>
                        <div class="camera-status">
                            <span class="status-indicator status-disconnected" id="status-indicator-${cameraId}"></span>
                            <span id="status-${cameraId}">未连接</span>
                        </div>
                        <div class="camera-controls">
                            <button class="button button-success connect-btn" data-camera="${cameraId}">连接</button>
                            <button class="button button-danger disconnect-btn" data-camera="${cameraId}" disabled>断开</button>
                            <button class="button button-secondary remove-btn" data-camera="${cameraId}">移除</button>
                        </div>
                    </div>
                    <div class="camera-card-body">
                        <div class="connection-info">
                            <span>服务器: ${config.host}:${config.port}</span>
                        </div>
                        <div class="video-container">
                            <video id="webrtc-video-${cameraId}" autoplay playsinline muted></video>
                        </div>
                        <div class="camera-stats">
                            <div class="stat-row">
                                <span class="stat-label">分辨率:</span>
                                <span class="stat-value" id="resolution-${cameraId}">-</span>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(cameraCard);

                const connectBtn = cameraCard.querySelector('.connect-btn');
                const disconnectBtn = cameraCard.querySelector('.disconnect-btn');
                const removeBtn = cameraCard.querySelector('.remove-btn');

                connectBtn.addEventListener('click', () => this.webrtcManager.connectCamera(cameraId));
                disconnectBtn.addEventListener('click', () => this.webrtcManager.disconnectCamera(cameraId));
                removeBtn.addEventListener('click', () => this.webrtcManager.removeCamera(cameraId));
            }

            onCameraRemoved(data) {
                const { cameraId } = data;
                const cameraCard = document.getElementById(`camera-card-${cameraId}`);
                if (cameraCard) {
                    cameraCard.remove();
                }

                if (this.webrtcManager.cameras.size === 0) {
                    const noCamerasMsg = document.getElementById('noCamerasMessage');
                    if (noCamerasMsg) noCamerasMsg.style.display = 'block';
                }
            }

            onStatusChange(data) {
                const { cameraId, status } = data;
                const indicator = document.getElementById(`status-indicator-${cameraId}`);
                const statusText = document.getElementById(`status-${cameraId}`);
                const connectBtn = document.querySelector(`.connect-btn[data-camera="${cameraId}"]`);
                const disconnectBtn = document.querySelector(`.disconnect-btn[data-camera="${cameraId}"]`);

                if (indicator) {
                    indicator.className = `status-indicator status-${status}`;
                }
                if (statusText) {
                    const statusMap = {
                        'connected': '已连接',
                        'connecting': '连接中',
                        'disconnected': '已断开',
                        'error': '错误'
                    };
                    statusText.textContent = statusMap[status] || status;
                }
                if (connectBtn && disconnectBtn) {
                    connectBtn.disabled = status === 'connected' || status === 'connecting';
                    disconnectBtn.disabled = status === 'disconnected' || status === 'error';
                }
            }

            onGlobalStatsUpdate(data) {
                this.updateGlobalStatsUI(data);
            }

            updateGlobalStatsUI(stats) {
                const connectedElement = document.getElementById('connected-count');
                if (connectedElement) connectedElement.textContent = `${stats.connectedCameras}/${stats.totalCameras}`;
                const qualityElement = document.getElementById('connection-quality');
                if (qualityElement) {
                    qualityElement.textContent = `${stats.connectionQuality.toFixed(0)}%`;
                    let cls = 'latency-low';
                    if (stats.connectionQuality < 60) cls = 'latency-high';
                    else if (stats.connectionQuality < 80) cls = 'latency-medium';
                    qualityElement.className = `stats-value ${cls}`;
                }
            }

            log(message) {
                console.log(`[WebRTCIntegration] ${message}`);
                this.appendDebugLog(message);
            }

            appendDebugLog(msg) {
                const debugContent = document.getElementById('debugContent');
                if (debugContent) {
                    const time = new Date().toLocaleTimeString();
                    this.debugLogs.push(`[${time}] ${msg}`);
                    debugContent.textContent = this.debugLogs.join('\n');
                    debugContent.scrollTop = debugContent.scrollHeight;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.webrtcIntegration = new WebRTCIntegration();
        });
    </script>
</body>
</html>
